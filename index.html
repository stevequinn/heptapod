<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Heptapod Experiment — Ink on Glass</title>
<meta name="description" content="A view into an observation window: fogged glass, two drifting heptapods, and their logographic script. Click and they answer." />
<link rel="stylesheet" href="/src/style.css" />

<!-- Link previews. The image is the deployed copy in public/, so it needs the
     absolute URL; the rest of the page is served from the domain root. -->
<meta property="og:locale" content="en_AU" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Heptapod" />
<meta property="og:title" content="Heptapod Experiment — Ink on Glass" />
<meta property="og:description" content="A view into an observation window: fogged glass, two drifting heptapods, and their logographic script. Click and they answer." />
<meta property="og:url" content="https://heptapod.dotdoing.com/" />
<meta property="og:image" content="https://heptapod.dotdoing.com/heptapod-preview.jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A heptapod logogram — a hand-drawn circle carrying dense blots of ink and fine bristles — on fogged glass, with one of the heptapods' limbs behind it." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Heptapod Experiment — Ink on Glass" />
<meta name="twitter:description" content="A view into an observation window: fogged glass, two drifting heptapods, and their logographic script. Click and they answer." />
<meta name="twitter:image" content="https://heptapod.dotdoing.com/heptapod-preview.jpeg" />
<meta name="twitter:image:alt" content="A heptapod logogram on fogged glass, with one of the heptapods' limbs behind it." />
</head>
<body>

<div id="reticle" aria-hidden="true">
  <i class="arc"></i><i class="ring"></i><i class="dot"></i>
</div>

<header id="title">
  <span>Heptapod&nbsp;&nbsp;/&nbsp;&nbsp;Observation&nbsp;Window</span>
  <span id="title-mode">Heptapod&nbsp;B&nbsp;&nbsp;·&nbsp;&nbsp;Containment</span>
</header>

<footer id="ui">
  <span id="hint-fine"><b class="k">Move</b>They follow &nbsp;·&nbsp; <b class="k">Click</b>Ask for a glyph</span>
  <span id="hint-coarse">Tap to communicate</span>
  <nav id="actions" aria-label="Controls">
    <button id="act-glyph" type="button"><b class="k">Space</b>Ask</button>
    <button id="act-clear" type="button"><b class="k">C</b>Clear</button>
    <button id="act-hide" type="button"><b class="k">H</b>Hide</button>
    <button id="act-sound" type="button" aria-pressed="true"><b class="k">M</b><span id="sound-label">Sound on</span></button>
  </nav>
</footer>

<!-- Two layers: ink is multiplied into the scene so it reads as being on the
     same glass, while the labels have to blend normally or `multiply` eats
     them against a dark background. -->
<canvas id="unwrap" aria-hidden="true"></canvas>
<canvas id="unwrap-labels" aria-hidden="true"></canvas>

<div id="boot">Listening&hellip;</div>
<pre id="fatal" hidden></pre>
<pre id="debug" hidden></pre>

<script type="module" src="/src/main.js"></script>
</body>
</html>
